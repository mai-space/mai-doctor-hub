# 4G passt auf GitHub-hosted Runner (~7G RAM); 8G killt den APK-Job per OOM.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Flutter 3.47 / AGP 9: newDsl opt-out bis Flutter-Plugin voll migriert ist.
android.newDsl=false
android.builtInKotlin=false
# R8 „Full Mode“ (Standard ab AGP 8) bricht Bibliotheken ohne vollständige
# Keep-Regeln (z. B. ML Kit Dokumentenscanner: NullPointerException beim Start).
android.enableR8.fullMode=false
