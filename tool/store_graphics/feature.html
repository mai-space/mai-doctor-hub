<!doctype html>
<!-- Play-Store-Vorstellungsgrafik 1024 × 500. Sprache per ?lang=de|en. -->
<html><head><meta charset="utf-8"><style>
  @font-face { font-family: Roboto; src: url("ROBOTO_DIR/Roboto-Regular.ttf"); font-weight: 400; }
  @font-face { font-family: Roboto; src: url("ROBOTO_DIR/Roboto-Medium.ttf"); font-weight: 500; }
  @font-face { font-family: Roboto; src: url("ROBOTO_DIR/Roboto-Bold.ttf"); font-weight: 700; }
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body {
    font-family: Roboto, sans-serif; color: #fff;
    background: linear-gradient(135deg, #2A9D8F 0%, #1F6B5C 100%);
    display: flex; align-items: center; gap: 56px; padding: 0 88px; box-sizing: border-box;
  }
  .logo { flex: none; width: 200px; height: 200px; border-radius: 48px; background: rgba(255,255,255,.14);
          display: flex; align-items: center; justify-content: center; }
  h1 { margin: 0 0 14px; font-size: 76px; font-weight: 700; letter-spacing: -1px; }
  p { margin: 0; font-size: 34px; line-height: 1.3; font-weight: 400; opacity: .95; max-width: 560px; }
  .tags { margin-top: 26px; display: flex; gap: 12px; }
  .tags span { font-size: 22px; font-weight: 500; padding: 8px 18px; border-radius: 999px;
               background: rgba(255,255,255,.18); }
</style></head><body>
<div class="logo">
  <svg xmlns="http://www.w3.org/2000/svg" width="150" height="150" viewBox="26 26 56 56">
    <path d="M36 30H47q2 0 3.5 1.5L54 35h18a6 6 0 0 1 6 6v29a6 6 0 0 1-6 6H36
             a6 6 0 0 1-6-6V36a6 6 0 0 1 6-6z" fill="#fff" fill-opacity=".55"/>
    <rect x="30" y="41" width="48" height="35" rx="6" fill="#fff"/>
    <rect x="50.5" y="48.5" width="7" height="20" rx="2" fill="#1F6B5C"/>
    <rect x="44" y="55" width="20" height="7" rx="2" fill="#1F6B5C"/>
  </svg>
</div>
<div>
  <h1>Ärzte</h1>
  <p id="claim"></p>
  <div class="tags" id="tags"></div>
</div>
<script>
  const texts = {
    de: { claim: 'Termine, Symptome, Medikamente und Befunde – privat auf deinem Handy.',
          tags: ['Ohne Konto', 'Verschlüsselt', 'Nur auf dem Gerät'] },
    en: { claim: 'Appointments, symptoms, medications and reports – private on your phone.',
          tags: ['No account', 'Encrypted', 'Stays on device'] },
  };
  const t = texts[new URLSearchParams(location.search).get('lang') || 'de'];
  document.getElementById('claim').textContent = t.claim;
  document.getElementById('tags').innerHTML = t.tags.map(x => `<span>${x}</span>`).join('');
</script>
</body></html>
