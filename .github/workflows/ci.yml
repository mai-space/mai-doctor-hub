# Mai Doctor Hub — Iteration 1 CI
# Linse: Secrets niemals im Repo · Fast Feedback · Kein PHI / kein Datenupload
name: CI

on:
  push:
    # Alle Branches: APK-Build früh validieren. deploy-mock läuft nur auf main.
    branches: ["**"]
  pull_request:
    branches: [main]

# Nur lesen; keine Schreibrechte für Actions im CI.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # PDFium für Host-Tests der PDF-Text-Extraktion (gleiches Release wie
      # pdfium_dart/hook/build.dart). Ohne PDFIUM_PATH werden sie übersprungen.
      - name: Download PDFium (tests)
        run: |
          mkdir -p "$RUNNER_TEMP/pdfium"
          curl -sSL --retry 3 \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7811/pdfium-linux-x64.tgz" \
            | tar -xz -C "$RUNNER_TEMP/pdfium"
          echo "PDFIUM_PATH=$RUNNER_TEMP/pdfium/lib/libpdfium.so" >> "$GITHUB_ENV"

      - name: Test
        run: flutter test

  dart-packages:
    name: MCP server & backup format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        package: [packages/mai_backup_format, tools/mai_mcp]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter (Dart SDK)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: Pub get
        run: dart pub get

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test
        run: dart test

  build-apk:
    name: Release APK
    needs: [analyze-test, dart-packages]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ubuntu-latest liefert ANDROID_HOME bereits (Runner-Image).
      # Kein android-actions/setup-android — das scheiterte im ersten Run.
      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses >/dev/null 2>&1 || true

      - name: Pub get
        run: flutter pub get

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Build release APK
        run: |
          set -o pipefail
          if ! flutter build apk --release 2>&1 | tee apk-build.log; then
            {
              echo "## APK build failed"
              echo
              echo '```text'
              # Kontext um den eigentlichen Fehler (nicht nur die FAILURE-Zeile)
              if grep -n 'What went wrong:' apk-build.log >/dev/null 2>&1; then
                start=$(grep -n 'What went wrong:' apk-build.log | tail -n 1 | cut -d: -f1)
                start=$((start > 5 ? start - 5 : 1))
                sed -n "${start},$((start + 40))p" apk-build.log
              else
                tail -n 120 apk-build.log
              fi
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # Annotationen: Fehlerblock, nicht die pub-outdated-Liste
            if grep -n 'What went wrong:' apk-build.log >/dev/null 2>&1; then
              start=$(grep -n 'What went wrong:' apk-build.log | tail -n 1 | cut -d: -f1)
              start=$((start > 2 ? start - 2 : 1))
              sed -n "${start},$((start + 25))p" apk-build.log
            else
              tail -n 30 apk-build.log
            fi | while IFS= read -r line; do
              safe=$(printf '%s' "$line" | tr '|' '/' | cut -c1-200)
              # Leere Zeilen und reine Trenner überspringen
              case "$safe" in
                ''|'---'*|'===') continue ;;
              esac
              echo "::error::$safe"
            done
            exit 1
          fi
        env:
          # Runner-RAM schonen; Daemon in CI ausschalten
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Upload APK build log (failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apk-build-log
          path: apk-build.log
          if-no-files-found: ignore
          retention-days: 7

      # Einheitlicher Dateiname über alle Apps: mai-<repo>.apk
      - name: Rename APK
        if: success()
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/mai-doctor-hub.apk

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mai-doctor-hub.apk
          path: build/app/outputs/flutter-apk/mai-doctor-hub.apk
          if-no-files-found: error
          retention-days: 14

      # Uhr-App (Wear OS, Modul android/wear): baut im selben Gradle-Lauf mit
      # (`assembleRelease` gilt für alle Module). Eigenes APK für die Uhr.
      - name: Rename Wear OS APK
        if: success()
        run: cp build/wear/outputs/apk/release/wear-release.apk build/wear/outputs/apk/release/mai-doctor-hub-wear.apk

      - name: Upload Wear OS APK artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mai-doctor-hub-wear.apk
          path: build/wear/outputs/apk/release/mai-doctor-hub-wear.apk
          if-no-files-found: error
          retention-days: 14

  # Signiertes App-Bundle für die Play Console, nur auf main und nur wenn die
  # Signatur-Secrets gesetzt sind (Repository-Secrets, siehe project-docs/RELEASE.md).
  # Ohne Secrets: Hinweis in der Zusammenfassung, Job bleibt grün.
  signed-bundle:
    name: Signed app bundle (main)
    needs: [analyze-test, dart-packages]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    steps:
      - name: Check signing secrets
        id: secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Kein signiertes Bundle: Signatur-Secrets fehlen (siehe project-docs/RELEASE.md)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        if: steps.secrets.outputs.ready == 'true'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: Accept Android licenses
        if: steps.secrets.outputs.ready == 'true'
        run: yes | flutter doctor --android-licenses >/dev/null 2>&1 || true

      - name: Pub get
        if: steps.secrets.outputs.ready == 'true'
        run: flutter pub get

      # Keystore und key.properties nur im Runner, nie im Repo oder Log.
      - name: Write signing config
        if: steps.secrets.outputs.ready == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          keystore="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          {
            printf 'storeFile=%s\n' "$keystore"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties

      # versionCode = Laufnummer: bleibt unter den Tag-Releases (ab 1000000),
      # die später darüber installiert werden.
      - name: Build signed app bundle
        if: steps.secrets.outputs.ready == 'true'
        env:
          REQUIRE_RELEASE_SIGNING: "true"
          BUILD_NUMBER: ${{ github.run_number }}
        run: flutter build appbundle --release --build-number="$BUILD_NUMBER"

      - name: Verify upload signature
        if: steps.secrets.outputs.ready == 'true'
        run: |
          for bundle in build/app/outputs/bundle/release/app-release.aab build/wear/outputs/bundle/release/wear-release.aab; do
            cert=$(keytool -printcert -jarfile "$bundle")
            if [ -z "$cert" ] || printf '%s' "$cert" | grep -q 'CN=Android Debug'; then
              echo "::error::$bundle is not signed with the upload key."
              exit 1
            fi
            printf '%s\n' "$cert" | grep -E 'Owner:|SHA256:' || true
          done
          cp build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/mai-doctor-hub.aab

      - name: Remove signing files
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload-keystore.jks"

      - name: Upload signed bundle
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mai-doctor-hub-signed-aab
          path: |
            build/app/outputs/bundle/release/mai-doctor-hub.aab
            build/wear/outputs/bundle/release/wear-release.aab
          if-no-files-found: error
          retention-days: 30

  # iOS: nur bauen (ohne Signatur) — TestFlight/App Store siehe project-docs/RELEASE.md.
  # Baut die Apple-Watch-App (Ziele „Watch“ und „WatchWidgets“) mit.
  ios:
    name: iOS build (no codesign)
    needs: [analyze-test, dart-packages]
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Flutter doctor
        run: flutter doctor -v

      # pod install (ML Kit) und Swift-Pakete laufen im Build automatisch.
      - name: Build iOS (release, no codesign)
        run: |
          set -o pipefail
          if ! flutter build ios --release --no-codesign 2>&1 | tee ios-build.log; then
            {
              echo "## iOS build failed"
              echo
              echo '```text'
              # Swift-/Xcode-Fehler zuerst, sonst das Ende des Logs
              if grep -nE 'error:|Error \(Xcode\)' ios-build.log >/dev/null 2>&1; then
                grep -nE -A3 'error:|Error \(Xcode\)' ios-build.log | head -n 120
              else
                tail -n 120 ios-build.log
              fi
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E 'error:' ios-build.log | head -n 30 | while IFS= read -r line; do
              safe=$(printf '%s' "$line" | tr '|' '/' | cut -c1-200)
              echo "::error::$safe"
            done
            exit 1
          fi

      - name: Upload iOS build log (failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-build-log
          path: ios-build.log
          if-no-files-found: ignore
          retention-days: 7

  deploy-mock:
    name: Deploy (mock)
    needs: build-apk
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Would deploy (no-op)
        run: |
          echo "would deploy"
          echo "Linse: kein PHI, kein Datenupload, kein echtes Hosting."
          echo "Artifact: mai-doctor-hub.apk (CI-only; not uploaded to any patient-facing service)."
          echo "Rollback: N/A — mock deploy performs no external mutation."
